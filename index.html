function repData(from, to, city) {
  const inR = t => t >= from && t < to; const cOk = s => !city || s.city === city;
  const sales = DB.sales.filter(s => inR(s.date) && s.status !== 'Cancelled' && cOk(s));
  const rets = DB.saleReturns.filter(r => inR(r.date) && cOk(saleBy(r.saleId) || {}));
  const purchases = DB.purchases.filter(p => inR(p.date) && p.status !== 'Cancelled');
  const pRets = DB.purchaseReturns.filter(r => inR(r.date));
  const expenses = DB.expenses.filter(e => inR(e.date));
  const sum = (L, f) => L.reduce((a, x) => a + f(x), 0);
  const gross = sum(sales, s => s.subtotalC), disc = sum(sales, s => s.itemDiscC + s.invDiscC), tax = sum(sales, s => s.taxC) - sum(rets, r => r.taxC);
  const rev = sum(sales, s => s.lines.reduce((b, l) => b + l.netC - l.taxC, 0)), cost = sum(sales, s => s.lines.reduce((b, l) => b + l.costC, 0));
  const retRev = sum(rets, r => r.revenueC), retCost = sum(rets, r => r.costC), retTotal = sum(rets, r => r.totalC);
  const netSales = rev - retRev, cogs = cost - retCost, gp = netSales - cogs, exp = sum(expenses, e => e.amountC);
  return { sales, rets, purchases, pRets, expenses, gross, disc, tax, rev, cost, retRev, retCost, retTotal, netSales, cogs, gp, exp, net: gp - exp, invTotal: sum(sales, s => s.totalC),
    purTotal: sum(purchases, p => p.totalC), purRet: sum(pRets, r => r.totalC), purPaid: sum(purchases, p => purPaidC(p)), purDue: sum(purchases, p => Math.max(0, purDueC(p))), due: sum(sales, s => Math.max(0, saleDueC(s))) };
}
function prodProfitCity(from, to, city) {
  const M = {}; const cOk = s => s && (!city || s.city === city);
  const k = (pid, u, name) => (M[pid + u] = M[pid + u] || { id: pid + u, pid, unit: u, name, soldQty: 0, grossRev: 0, grossCost: 0, retQty: 0, retRev: 0, retCost: 0 });
  DB.sales.filter(s => s.status !== 'Cancelled' && s.date >= from && s.date < to && cOk(s)).forEach(s => s.lines.forEach(l => { const r = k(l.pid, l.unit, l.name); r.soldQty = q3(r.soldQty + l.qty); r.grossRev += l.netC - l.taxC; r.grossCost += l.costC; }));
  DB.saleReturns.filter(x => x.date >= from && x.date < to && cOk(saleBy(x.saleId))).forEach(x => x.lines.forEach(l => { const r = k(l.pid, l.unit, l.name); r.retQty = q3(r.retQty + l.qty); r.retRev += l.revenueC; r.retCost += l.costC; }));
  return Object.values(M).map(r => ({ ...r, netQty: q3(r.soldQty - r.retQty), revenue: r.grossRev - r.retRev, cost: r.grossCost - r.retCost, profit: r.grossRev - r.retRev - r.grossCost + r.retCost }));
}

/* scenario & integrity verification — recomputes everything from the original invoice lines */
function verificationHTML() {
  const ok = b => b ? badge('PASS', 'var(--success)', 'check-circle-fill') : badge('FAIL', 'var(--danger)', 'x-circle-fill');
  const sc = DB.sales.filter(s => /^Scenario \d/.test(s.notes || '')).sort((a, b) => a.notes.localeCompare(b.notes));
  const lineRow = (s, l) => { const r = lineRem(l); const expRev = amtC(r, l.priceP4), expCost = amtC(r, l.costP4); const rev = lineAt(l, r, 'netC') - lineAt(l, r, 'taxC'), cost = lineAt(l, r, 'costC'); const disc = l.itemDiscC + l.invDiscC + l.taxC > 0;
    const pass = disc || (rev === expRev && cost === expCost); return { pass, html: `<tr><td class="primary"><b>${esc(l.name)}</b><div class="small-xs text-muted">${esc(s.notes)}</div></td><td data-label="Sold" class="te num">${fmtQ(l.qty, l.unit)} × ${price(l.priceP4)} = ${money(l.netC)}</td><td data-label="Cost" class="te num">${price(l.costP4)}/${UNITS[l.unit].short}</td><td data-label="Returned" class="te num c-danger">${fmtQ(l.retQty, l.unit)}</td><td data-label="Remaining" class="te num fw-7">${fmtQ(r, l.unit)}</td><td data-label="Revenue" class="te num">${money(rev)}<div class="small-xs text-muted">expected ${money(expRev)}</div></td><td data-label="Cost" class="te num">${money(cost)}<div class="small-xs text-muted">expected ${money(expCost)}</div></td><td data-label="Profit" class="te num c-success fw-7">${money(rev - cost)}<div class="small-xs text-muted">expected ${money(expRev - expCost)}</div></td><td data-label="Result">${ok(pass)}</td></tr>` }; };
  const rows = sc.flatMap(s => s.lines.map(l => lineRow(s, l)));
  const bad = verifyStock();
  const all = metrics(0, 8.64e15); const perSale = DB.sales.reduce((a, s) => a + saleProfit(s).profit, 0);
  const layerOk = DB.products.every(p => UKEYS.every(u => { const L = DB.layers.filter(l => l.pid === p.id && l.unit === u && l.qty > 0).reduce((a, l) => q3(a + l.qty), 0); return stockOf(p, u) < 0 || L === stockOf(p, u); }));
  const retOk = DB.saleReturns.every(r => r.lines.every(l => { const s = saleBy(r.saleId); const sl = s?.lines.find(x => x.id === l.lineId); return sl && l.priceP4 === sl.priceP4 && l.costP4 === sl.costP4; }));
  const overRet = DB.sales.every(s => s.lines.every(l => l.retQty <= l.qty));
  const cashOk = DB.sessions.filter(s => s.status === 'Closed').every(s => s.expectedC != null);
  const checks = [['Stock ledger: movements add up to current stock (every product & unit)', !bad.length, bad.length ? bad.map(x => `${x.p.name} ${x.u}: ledger ${x.sum} vs stock ${x.stock}`).join('; ') : `${DB.movements.length} movements checked`],
    ['FIFO cost layers equal stock on hand', layerOk, S().inventory.costMethod.toUpperCase() + ' method active; layers are always kept'], ['Returns use the original invoice price and cost', retOk, `${DB.saleReturns.length} returns checked`], ['No line returned more than sold', overRet, ''],
    ['Profit report = sum of invoice profits (all time)', all.gross === perSale, `${money(all.gross)} vs ${money(perSale)}`], ['Closed register sessions have an expected cash figure', cashOk, `${DB.sessions.length} sessions`]];
  return `${card('Integrity checks', `<div class="dt-wrap"><table class="dt"><tbody>${checks.map(c => `<tr><td>${ok(c[1])}</td><td><b>${c[0]}</b><div class="small-xs text-muted">${esc(c[2])}</div></td></tr>`).join('')}</tbody></table></div>`, { flush: true, sub: 'Recomputed live from the stored data' })}
  <div class="mt-3">${card('Return scenarios (from the demo data)', rows.length ? `<div class="dt-wrap"><table class="dt cards"><thead><tr><th>Line</th><th class="te">Sold</th><th class="te">Unit cost</th><th class="te">Returned</th><th class="te">Remaining</th><th class="te">Revenue</th><th class="te">Cost</th><th class="te">Profit</th><th>Result</th></tr></thead><tbody>${rows.map(r => r.html).join('')}</tbody></table></div>` : empty('clipboard-check', 'No scenario invoices', 'Scenario invoices are created with the demo data (Settings → Data → Reset demo data).'), { flush: true, sub: 'Expected = remaining quantity × original price / original cost' })}</div>`;
}

function saveSettings(tab, f) {
  clearErrs(f); const v = formVals(f); const st = S();
  const req = (n, msg) => { if (!String(v[n] ?? '').trim()) { setErr(fEl(f, n), msg); fEl(f, n).focus(); return false; } return true; };
  if (tab === 'company') { if (!req('cname', 'Enter the company name.')) return; if (v.email && !/^\S+@\S+\.\S+$/.test(v.email)) return setErr(fEl(f, 'email'), 'Enter a valid email.'); Object.assign(st.company, { name: v.cname.trim(), tagline: v.tagline.trim(), phone: v.phone.trim(), phone2: v.phone2.trim(), email: v.email.trim(), address: v.addr.trim(), city: v.city.trim(), taxNo: v.taxNo.trim() }); }
  if (tab === 'invoice') { if (!req('prefix', 'Enter a prefix.') || !req('purchasePrefix', 'Enter a prefix.')) return; if (v.prefix.trim() === v.purchasePrefix.trim()) return setErr(fEl(f, 'purchasePrefix'), 'Must be different from the sales prefix.'); Object.assign(st.invoice, { prefix: v.prefix.trim(), purchasePrefix: v.purchasePrefix.trim(), defaultSize: v.defaultSize, footer: v.footer.trim(), terms: v.terms.trim(), showBarcode: v.showBarcode, showCashier: v.showCashier, showCustomer: v.showCustomer }); }
  if (tab === 'pos') Object.assign(st.pos, { defaultSaleType: v.defaultSaleType, defaultCustomer: v.defaultCustomer || '', scanAutoAdd: v.scanAutoAdd, autoPrint: v.autoPrint, sound: v.sound, allowPriceEdit: v.allowPriceEdit });
  if (tab === 'inventory') { const n = Number(v.lowStockDefault); if (!(n >= 0)) return setErr(fEl(f, 'lowStockDefault'), 'Enter a number ≥ 0.'); if (!v.allowNegative && DB.products.some(p => UKEYS.some(u => stockOf(p, u) < 0))) return toast('error', 'Some products have negative stock', 'Adjust them before turning this off.'); if (st.inventory.costMethod !== v.costMethod) audit('Cost method changed', '', `${st.inventory.costMethod} → ${v.costMethod}`); Object.assign(st.inventory, { costMethod: v.costMethod, lowStockDefault: n, allowNegative: v.allowNegative }); }
  if (tab === 'tax') { const r = Number(v.rate); if (!(r >= 0 && r <= 100)) return setErr(fEl(f, 'rate'), 'Enter a rate between 0 and 100.'); if (v.enabled && !r) return setErr(fEl(f, 'rate'), 'Enter the tax rate.'); Object.assign(st.tax, { enabled: v.enabled, rate: r, label: v.label.trim() || 'Tax' }); }
  if (tab === 'currency') { if (!/^[A-Za-z]{3}$/.test(v.code.trim())) return setErr(fEl(f, 'code'), 'Use a 3-letter code (USD, IQD).'); if (!req('symbol', 'Enter a symbol.')) return; Object.assign(st.currency, { code: v.code.trim().toUpperCase(), symbol: v.symbol.trim(), decimals: +v.decimals, pos: v.pos }); }
  audit('Settings changed', tab); saveDB(); renderShell(); toast('success', 'Settings saved'); rerender();
}

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot() {
  try { loadDB(); } catch (e) { console.error(e); seedDB(); saveDB(); }
  applyTheme(); applyLang();
  if (CART && !Array.isArray(CART.lines)) CART = null;
  if (CART) CART.lines = CART.lines.filter(l => { const p = prodBy(l.pid); return p && p.units[l.unit]?.on; });
  if (AUTH.userId && DB.users.find(u => u.id === AUTH.userId && u.active)) { $('#app').hidden = false; renderShell(); route(); }
  else { AUTH = { userId: null }; showLogin(); }
  lowStockCheck(DB.products.filter(p => p.active));
})();
