<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>AMED ELECTRONIC · POS & Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="bsCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
/* apply saved theme before paint (no flash) */
(function () { try { var p = JSON.parse(localStorage.getItem('amed.prefs') || '{}'); if (p.dark) document.documentElement.setAttribute('data-bs-theme', 'dark'); if (p.lang === 'ar') { var h = document.documentElement; h.lang = 'ar'; h.dir = 'rtl'; var l = document.getElementById('bsCss'); if (l) l.href = l.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css'); } } catch (e) {} })();
</script>
<style>
/* =====================================================================
   AMED ELECTRONIC — design tokens
   ===================================================================== */
:root{
  --primary:#1d4ed8; --primary-rgb:29,78,216; --accent:#f59e0b;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#eef2f7; --border:#e3e8ef; --border-strong:#cfd6e1;
  --text:#0f172a; --text-2:#475569; --text-3:#64748b;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#0284c7; --violet:#7c3aed;
  --sb-bg:#0b1220; --sb-text:#aab4c5; --sb-muted:#64748b; --sb-active-bg:rgba(var(--primary-rgb),.18); --sb-active:#fff; --sb-hover:rgba(255,255,255,.06); --sb-border:rgba(255,255,255,.06);
  --sb-w:258px; --sb-w-mini:74px; --hdr-h:62px;
  --radius:12px; --radius-sm:8px; --fs:14px; --cell-py:.7rem; --gap:1.1rem;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.05);
  --shadow:0 4px 14px -4px rgba(15,23,42,.10),0 2px 4px -2px rgba(15,23,42,.05);
  --shadow-lg:0 24px 48px -16px rgba(15,23,42,.30);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-bs-theme="dark"]{
  --bg:#0a0f1a; --surface:#111827; --surface-2:#0e1523; --surface-3:#1a2334; --border:#1f2a3c; --border-strong:#2c3a52;
  --text:#e6ebf3; --text-2:#aeb9ca; --text-3:#8391a7;
  --success:#22c55e; --warning:#f59e0b; --danger:#f87171; --info:#38bdf8; --violet:#a78bfa;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 6px 18px -6px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -16px rgba(0,0,0,.8);
  --bs-body-bg:var(--bg); --bs-body-color:var(--text); --bs-border-color:var(--border); --bs-secondary-bg:var(--surface-3); --bs-tertiary-bg:var(--surface-2);
}
body.sb-light{--sb-bg:#ffffff; --sb-text:#475569; --sb-muted:#94a3b8; --sb-active:var(--primary); --sb-active-bg:rgba(var(--primary-rgb),.10); --sb-hover:rgba(15,23,42,.05); --sb-border:var(--border)}
[data-bs-theme="dark"] body.sb-light{--sb-bg:#0f1624; --sb-text:#aeb9ca; --sb-active:#93b4ff; --sb-hover:rgba(255,255,255,.05)}
body.compact{--cell-py:.42rem; --gap:.75rem; --hdr-h:54px}
body.density-comfortable{--cell-py:.85rem}

html{font-size:var(--fs)}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--primary);text-decoration:none}
.btn{--bs-btn-border-radius:var(--radius-sm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn-primary{--bs-btn-bg:var(--primary);--bs-btn-border-color:var(--primary);--bs-btn-hover-bg:color-mix(in srgb,var(--primary) 88%,#000);--bs-btn-hover-border-color:color-mix(in srgb,var(--primary) 88%,#000);--bs-btn-active-bg:color-mix(in srgb,var(--primary) 80%,#000);--bs-btn-disabled-bg:var(--primary);--bs-btn-disabled-border-color:var(--primary)}
.btn-soft{background:rgba(var(--primary-rgb),.1);color:var(--primary);border:0}
.btn-soft:hover{background:rgba(var(--primary-rgb),.18);color:var(--primary)}
.btn-light{--bs-btn-bg:var(--surface);--bs-btn-border-color:var(--border);--bs-btn-hover-bg:var(--surface-3);--bs-btn-hover-border-color:var(--border-strong);--bs-btn-color:var(--text)}
[data-bs-theme="dark"] .btn-light{--bs-btn-color:var(--text);--bs-btn-active-bg:var(--surface-3)}
.btn-icon{width:38px;height:38px;padding:0}
.btn-sm.btn-icon{width:32px;height:32px}
.form-control,.form-select{border-radius:var(--radius-sm);border-color:var(--border-strong);background-color:var(--surface)}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(var(--primary-rgb),.18)}
.form-label{font-weight:600;font-size:.82rem;color:var(--text-2);margin-bottom:.3rem}
.form-check-input:checked{background-color:var(--primary);border-color:var(--primary)}
.req::after{content:" *";color:var(--danger)}
.invalid-feedback{font-size:.78rem}
.text-muted{color:var(--text-3)!important}
.fw-7{font-weight:700}.fw-6{font-weight:600}.small-xs{font-size:.75rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.c-success{color:var(--success)!important}.c-danger{color:var(--danger)!important}.c-warning{color:var(--warning)!important}.c-primary{color:var(--primary)!important}
.dropdown-menu{border-color:var(--border);box-shadow:var(--shadow-lg);border-radius:var(--radius-sm);background:var(--surface)}
.modal-content{border-radius:var(--radius);border-color:var(--border);background:var(--surface)}
.modal-header,.modal-footer{border-color:var(--border)}
.modal-backdrop.show{opacity:.55}

/* =====================================================================
   LAYOUT
   ===================================================================== */
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sb-w);background:var(--sb-bg);color:var(--sb-text);z-index:1040;display:flex;flex-direction:column;border-inline-end:1px solid var(--sb-border);transition:width .22s ease,transform .25s ease}
body.sb-right .sidebar{inset-inline-start:auto;inset-inline-end:0;border-inline-end:0;border-inline-start:1px solid var(--sb-border)}
.main{margin-inline-start:var(--sb-w);min-height:100vh;display:flex;flex-direction:column;transition:margin .22s ease}
body.sb-right .main{margin-inline-start:0;margin-inline-end:var(--sb-w)}
.brand{height:var(--hdr-h);display:flex;align-items:center;gap:.7rem;padding:0 1.1rem;border-bottom:1px solid var(--sb-border);flex-shrink:0}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#0ea5e9);display:grid;place-items:center;color:#fff;font-size:1.25rem;flex-shrink:0;box-shadow:0 6px 14px -6px rgba(var(--primary-rgb),.8)}
.brand-mark i{color:#fde047}
.brand-text{line-height:1.1;overflow:hidden;white-space:nowrap}
.brand-text b{display:block;font-weight:800;letter-spacing:.04em;color:var(--sb-active);font-size:.95rem}
body.sb-light .brand-text b{color:var(--text)}
.brand-text small{font-size:.7rem;color:var(--sb-muted);letter-spacing:.08em;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:.7rem .65rem 1rem;scrollbar-width:thin}
.sb-sec{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--sb-muted);padding:.9rem .75rem .35rem;font-weight:700;white-space:nowrap}
.sb-link{display:flex;align-items:center;gap:.75rem;padding:.58rem .75rem;border-radius:9px;color:var(--sb-text);font-weight:500;margin-bottom:2px;white-space:nowrap;position:relative;cursor:pointer}
.sb-link i{font-size:1.08rem;width:22px;text-align:center;flex-shrink:0}
.sb-link:hover{background:var(--sb-hover);color:var(--sb-active)}
.sb-link.active{background:var(--sb-active-bg);color:var(--sb-active);font-weight:600}
.sb-link.active::before{content:"";position:absolute;inset-inline-start:-.65rem;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.sb-link .sb-badge{margin-inline-start:auto;font-size:.68rem;padding:.12rem .45rem;border-radius:20px;background:var(--danger);color:#fff;font-weight:700}
.sb-foot{padding:.75rem;border-top:1px solid var(--sb-border)}
.sb-user{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.sb-user:hover{background:var(--sb-hover)}
.sb-user b{color:var(--sb-active);font-size:.85rem;display:block}
body.sb-light .sb-user b{color:var(--text)}
.sb-user small{font-size:.72rem;color:var(--sb-muted)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#fff;flex-shrink:0;background:var(--c,#475569)}
.sb-close{display:none;margin-inline-start:auto;color:var(--sb-text)}
/* mini sidebar (tablet / collapsed) */
body.sb-mini .sidebar{width:var(--sb-w-mini)}
body.sb-mini .main{margin-inline-start:var(--sb-w-mini)}
body.sb-right.sb-mini .main{margin-inline-start:0;margin-inline-end:var(--sb-w-mini)}
body.sb-mini .brand-text,body.sb-mini .sb-sec,body.sb-mini .sb-link span,body.sb-mini .sb-user .meta{display:none}
body.sb-mini .sb-link{justify-content:center;padding:.65rem}
body.sb-mini .sb-link .sb-badge{position:absolute;top:2px;inset-inline-end:4px;padding:.05rem .3rem}
body.sb-mini .brand{justify-content:center;padding:0}
body.sb-mini .sb-sec{height:.6rem;padding:0}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:1035;backdrop-filter:blur(2px)}

.topbar{height:var(--hdr-h);position:sticky;top:0;z-index:1020;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem;padding:0 1.25rem}
.topbar .search{flex:1;max-width:520px;position:relative}
.topbar .search input{padding-inline-start:2.4rem;height:40px;background:var(--surface-2)}
.topbar .search>i{position:absolute;inset-inline-start:.85rem;top:50%;transform:translateY(-50%);color:var(--text-3)}
.topbar .search kbd{position:absolute;inset-inline-end:.6rem;top:50%;transform:translateY(-50%);font-size:.68rem;background:var(--surface-3);color:var(--text-3);border:1px solid var(--border)}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:.35rem}
.tb-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center;position:relative;font-size:1.1rem}
.tb-btn:hover{background:var(--surface-3);color:var(--text)}
.tb-btn .dot{position:absolute;top:5px;inset-inline-end:5px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.content{padding:1.35rem;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.15rem;flex-wrap:wrap}
.page-head h1{font-size:1.45rem;font-weight:800;margin:0;letter-spacing:-.02em}
.page-head p{margin:.2rem 0 0;color:var(--text-3);font-size:.88rem}
.page-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.crumbs{font-size:.76rem;color:var(--text-3);margin-bottom:.2rem}
.footer{padding:.9rem 1.35rem;font-size:.76rem;color:var(--text-3);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* =====================================================================
   COMPONENTS
   ===================================================================== */
.card{border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-sm)}
.card-header{background:transparent;border-bottom:1px solid var(--border);padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.card-header h3,.card-header h5{font-size:1rem;font-weight:700;margin:0}
.card-header .sub{font-size:.78rem;color:var(--text-3);margin-top:.1rem}
.card-body{padding:1.1rem}
.kpi{padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.55rem;height:100%;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:1.2rem;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.kpi .val{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .lbl{color:var(--text-3);font-size:.8rem;font-weight:600}
.kpi .sub{font-size:.74rem;color:var(--text-3)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--gap)}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap)}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:220px}
.badge-s{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .55rem;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .5rem;border-radius:6px;font-size:.72rem;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.unit-chip{font-size:.68rem;font-weight:800;letter-spacing:.03em;padding:.1rem .4rem;border-radius:5px;text-transform:uppercase}
.u-pcs{background:rgba(37,99,235,.12);color:#2563eb}.u-m{background:rgba(22,163,74,.13);color:#15803d}.u-kg{background:rgba(217,119,6,.14);color:#b45309}
[data-bs-theme="dark"] .u-pcs{color:#93b4ff}[data-bs-theme="dark"] .u-m{color:#4ade80}[data-bs-theme="dark"] .u-kg{color:#fbbf24}
.empty{text-align:center;padding:2.4rem 1rem;color:var(--text-3)}
.empty .ei{width:64px;height:64px;border-radius:18px;margin:0 auto .8rem;display:grid;place-items:center;font-size:1.7rem;background:var(--surface-3);color:var(--text-3)}
.empty h5{color:var(--text);font-weight:700;font-size:1rem;margin-bottom:.25rem}
.tabs-s{display:flex;gap:.3rem;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:1rem}
.tabs-s button{border:0;background:none;padding:.6rem .85rem;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:.88rem;display:inline-flex;gap:.4rem;align-items:center}
.tabs-s button.on{color:var(--primary);border-color:var(--primary)}
.tabs-s .cnt{font-size:.7rem;background:var(--surface-3);padding:.05rem .45rem;border-radius:10px;color:var(--text-2)}
.seg{display:inline-flex;background:var(--surface-3);padding:3px;border-radius:10px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.38rem .8rem;border-radius:8px;font-weight:600;font-size:.82rem;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.list-row{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.1rem;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:0}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem 1.2rem}
.info-grid small{display:block;color:var(--text-3);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.info-grid span{font-weight:600}
.sum-row{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;font-size:.9rem}
.sum-row.total{font-size:1.1rem;font-weight:800;border-top:1px dashed var(--border-strong);margin-top:.35rem;padding-top:.6rem}
.calc{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.calc .r{display:flex;justify-content:space-between;padding:.55rem .85rem;border-bottom:1px solid var(--border);font-size:.9rem}
.calc .r:last-child{border-bottom:0;background:var(--surface-2);font-weight:800}
.skeleton{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:12px}
@keyframes sk{to{background-position:-200% 0}}

/* data tables */
.dt-tools{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.85rem 1.1rem;border-bottom:1px solid var(--border)}
.dt-tools .srch{position:relative;min-width:220px;flex:1;max-width:340px}
.dt-tools .srch i{position:absolute;inset-inline-start:.7rem;top:50%;transform:translateY(-50%);color:var(--text-3)}
.dt-tools .srch input{padding-inline-start:2.1rem}
.dt-tools .form-select,.dt-tools .form-control{width:auto;min-width:130px}
.dt-wrap{overflow-x:auto}
table.dt{width:100%;margin:0;border-collapse:separate;border-spacing:0}
table.dt th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700;padding:.7rem .9rem;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);text-align:start}
table.dt th.sortable{cursor:pointer;user-select:none}
table.dt th.sortable:hover{color:var(--text)}
table.dt td{padding:var(--cell-py) .9rem;border-bottom:1px solid var(--border);vertical-align:middle;font-size:.88rem}
table.dt tbody tr:hover td{background:color-mix(in srgb,var(--primary) 4%,transparent)}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt .te{text-align:end}
table.dt tr.row-warn td{background:color-mix(in srgb,var(--warning) 7%,transparent)}
table.dt tr.row-bad td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
table.dt tfoot td{font-weight:800;background:var(--surface-2);border-top:1px solid var(--border-strong)}
.dt-foot{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.7rem 1.1rem;border-top:1px solid var(--border);font-size:.82rem;color:var(--text-3);flex-wrap:wrap}
.pager{display:flex;gap:.25rem}
.pager button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-weight:600;font-size:.82rem}
.pager button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.4}
.actions{display:flex;gap:.25rem;justify-content:flex-end}
.prod-cell{display:flex;align-items:center;gap:.65rem;min-width:180px}
.pimg{width:40px;height:40px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--text-3);overflow:hidden;flex-shrink:0;font-size:1.1rem}
.pimg img{width:100%;height:100%;object-fit:cover}
.prod-cell b{display:block;font-size:.88rem;line-height:1.25}
.prod-cell small{font-size:.74rem;color:var(--text-3)}

/* toasts */
.toast-box{position:fixed;top:calc(var(--hdr-h) + 10px);inset-inline-end:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;width:360px;max-width:calc(100vw - 24px)}
.tst{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem .9rem;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-inline-start:4px solid var(--c);animation:tin .25s ease}
.tst i.ti{color:var(--c);font-size:1.15rem;margin-top:1px}
.tst b{display:block;font-size:.88rem}
.tst p{margin:0;font-size:.8rem;color:var(--text-2)}
.tst button{margin-inline-start:auto;border:0;background:none;color:var(--text-3)}
.tst.out{animation:tout .2s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@keyframes tout{to{opacity:0;transform:translateX(20px)}}

/* global search */
.gs-results{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:70vh;overflow:auto;z-index:1050;padding:.35rem}
.gs-group{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:700;padding:.55rem .7rem .25rem}
.gs-item{display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border-radius:8px;cursor:pointer;color:var(--text)}
.gs-item:hover,.gs-item.on{background:rgba(var(--primary-rgb),.08)}
.gs-item .gi{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2)}
.gs-item b{font-size:.86rem;display:block;font-weight:600}

.pgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:.65rem;align-content:start;padding:2px 2px 6px}

.ptile:active{transform:scale(.98)}
.ptile.out{opacity:.55}
.ptile .nm{font-weight:700;font-size:.85rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .meta{font-size:.72rem;color:var(--text-3)}
.ptile .units{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:auto}
.ptile .pr{font-weight:800;font-size:.9rem}
.pos-cart{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cart-head{padding:.75rem .9rem;border-bottom:1px solid var(--border);display:flex;gap:.5rem;align-items:center}

.cust-pick b{font-size:.84rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust-pick small{font-size:.72rem;color:var(--text-3)}
.cart-items{flex:1;overflow:auto}
.cline{padding:.6rem .9rem;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:.35rem .6rem}
.cline.sel{background:rgba(var(--primary-rgb),.06)}
.cline .nm{font-weight:700;font-size:.85rem;line-height:1.25}
.cline .sub{font-size:.72rem;color:var(--text-3)}
.cline .row2{grid-column:1/-1;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty button{width:32px;height:32px;border:0;background:var(--surface-2);font-weight:800;color:var(--text)}
.qty input{width:70px;height:32px;border:0;text-align:center;font-weight:700;background:transparent;color:var(--text)}
.unit-sel{height:32px;padding:0 1.8rem 0 .5rem;font-size:.8rem;font-weight:700;width:auto}
.mini{height:32px;width:78px;font-size:.8rem;padding:.2rem .45rem}
.cart-foot{border-top:1px solid var(--border);padding:.8rem .9rem;background:var(--surface-2)}

.pay-btn{height:52px;font-size:1.02rem}

.cart-fab{display:none}
.cart-close{display:none}
.pos-closed{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:center;border-radius:var(--radius)}

.pay-sum div{border:1px solid var(--border);border-radius:10px;padding:.6rem .75rem}
.pay-sum small{display:block;font-size:.72rem;color:var(--text-3);font-weight:600}
.pay-sum b{font-size:1.15rem}
.pay-row{display:grid;grid-template-columns:130px 1fr auto;gap:.5rem;align-items:center;margin-bottom:.5rem}
.quick-cash{display:flex;gap:.35rem;flex-wrap:wrap}
.quick-cash button{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:.35rem .65rem;font-weight:700;font-size:.8rem;color:var(--text)}
.quick-cash button:hover{border-color:var(--primary);color:var(--primary)}

.doc-th .big{font-size:14px;font-weight:800}
.doc-preview{background:var(--surface-3);border-radius:var(--radius);padding:14px;overflow:auto;max-height:70vh}

/* login */

/* theme page */

   ===================================================================== */

<body>
<div id="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="sb-overlay" id="sbOverlay"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content" tabindex="-1"></main>
    <footer class="footer" id="footer"></footer>
  </div>
</div>
<div id="login" hidden></div>
<div class="toast-box" id="toasts" aria-live="polite"></div>
<div id="modals"></div>
<div id="printArea"></div>
<script>
'use strict';
/* =====================================================================
   UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
let CLOCK = null; // used by the demo seeder to post documents in the past
const now = () => CLOCK ?? Date.now();
const pad = (n, l = 2) => String(n).padStart(l, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------------- money & quantity (no floating point money) ----------------
   Amounts are integer CENTS.  Unit prices/costs are integer P4 (1/10,000 of the
   currency unit) so $0.125/kg is stored exactly as 1250.  Quantities are rounded
   to 3 decimals and multiplied as integers (milli-units). */
const q3 = x => Math.round((+x || 0) * 1000) / 1000;
const toC = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g, '')); return isFinite(n) ? Math.round(n * 100) : 0; };
const toP4 = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g, '')); return isFinite(n) ? Math.round(n * 10000) : 0; };
const amtC = (qty, p4) => Math.round(Math.round(q3(qty) * 1000) * p4 / 100000);     // qty × unit price → cents
const p4Of = (cents, qty) => qty ? Math.round(cents * 100 / qty) : 0;                 // cents ÷ qty → P4
const prop = (cents, part, whole) => whole ? Math.round(cents * part / whole) : 0;     // proportional share
const cStr = c => (c / 100).toFixed(2);
const p4Str = p => { const s = (p / 10000).toFixed(4).replace(/0+$/, ''); return (s.split('.')[1] || '').length < 2 ? (p / 10000).toFixed(2) : s; };
function allocate(total, weights) { // split cents by weights, exact (largest remainder)

}
function statementDoc(kind, id) {

ROUTES.dashboard = { title: 'Dashboard', render() {
  const [t0, t1] = range('today'), [y0] = range('yesterday'); const T = metrics(t0, t1), Y = metrics(y0, t0);
  const stockVal = DB.products.reduce((a, p) => a + unitsOf(p).reduce((b, u) => b + stockValueC(p, u), 0), 0);
  const custBal = DB.customers.reduce((a, c) => a + Math.max(0, custBalanceC(c)), 0), supBal = DB.suppliers.reduce((a, s) => a + Math.max(0, supBalanceC(s)), 0);
  const [m0] = range('month'); const monthExp = metrics(m0, t1).expenses;
  const pct = (a, b) => b ? ((a - b) / Math.abs(b) * 100) : null;
  const delta = d => d == null ? '' : `<span class="small-xs fw-6 ${d >= 0 ? 'c-success' : 'c-danger'}"><i class="bi bi-arrow-${d >= 0 ? 'up' : 'down'}-right"></i>${Math.abs(d).toFixed(1)}% vs yesterday</span>`;
  const K = [
    ["Today's Sales", money(T.netSales), 'cash-stack', 'var(--primary)', `${T.count} invoices · ${delta(pct(T.netSales, Y.netSales))}`, 'sales?period=today', null],
    ["Today's Profit", money(T.gross), 'graph-up-arrow', 'var(--success)', T.netSales ? `${(T.gross / T.netSales * 100).toFixed(1)}% margin · ${delta(pct(T.gross, Y.gross))}` : 'gross profit', 'reports?tab=profit', 'profit.view'],
    ["Today's Purchases", money(T.purchases), 'truck', 'var(--violet)', 'posted purchase invoices', 'purchases', 'purchase.view'],
    ["Today's Returns", money(T.retTotal), 'arrow-return-left', 'var(--danger)', `${T.retCount} return(s)`, 'returns', null],
    ['Stock Value', money(stockVal), 'box-seam', '#0891b2', `cost method: ${S().inventory.costMethod.toUpperCase()}`, 'inventory', 'profit.view'],
    ['Customer Balance', money(custBal), 'person-exclamation', 'var(--warning)', `${DB.customers.filter(c => custBalanceC(c) > 0).length} customers owe`, 'customers', 'customer.manage'],
    ['Supplier Balance', money(supBal), 'building-exclamation', '#db2777', 'what you owe suppliers', 'suppliers', 'supplier.manage'],
    ['Expenses (month)', money(monthExp), 'wallet2', '#64748b', `today ${money(T.expenses)}`, 'expenses', 'expense.manage']
  ].filter(k => !k[6] || can(k[6]));
  const low = lowStockList();
  const days = 14; const lab = [], sal = [], pur = [], prof = [], exp = [];
  for (let i = days - 1; i >= 0; i--) { const a = t0 - i * DAY; const m = metrics(a, a + DAY); lab.push(new Date(a).toLocaleDateString(LOC(), { day: '2-digit', month: 'short' })); sal.push(m.netSales); pur.push(m.purchases); prof.push(m.gross); exp.push(m.expenses); }
  const top = productProfit(...range('30')).sort((a, b) => b.revenue - a.revenue).slice(0, 6);
  const ses = openSession();
  view(pageHead(`Welcome, ${esc(ME().name.split(' ')[0])}`, `${new Date(now()).toLocaleDateString(LOC(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · ${ses ? `Register ${ses.no} open by ${esc(userBy(ses.userId).name)}` : '<span class="c-warning fw-6">Register is closed</span>'}`,
    `${can('purchase.create') ? '<a class="btn btn-light" href="#/purchase-new"><i class="bi bi-truck"></i>New purchase</a>' : ''}${can('sale.return') ? '<a class="btn btn-light" href="#/returns?new=1"><i class="bi bi-arrow-return-left"></i>Return</a>' : ''}${can('pos.view') ? '<a class="btn btn-primary" href="#/pos"><i class="bi bi-upc-scan"></i>New sale</a>' : ''}`) + `
  ${low.length ? `<div class="alert alert-warning d-flex align-items-center gap-2 py-2"><i class="bi bi-exclamation-triangle-fill"></i><div class="flex-fill small"><b>${low.length} low / out-of-stock item(s).</b> ${low.slice(0, 3).map(x => esc(x.p.name) + ' (' + fmtQ(x.q, x.u) + ')').join(', ')}${low.length > 3 ? '…' : ''}</div><a href="#/inventory?f=low" class="btn btn-sm btn-warning">Review</a></div>` : ''}
  <div class="kpi-grid mb-3">${K.map(k => `<a class="card kpi text-reset" href="#/${k[5]}" style="--c:${k[3]}"><div class="d-flex justify-content-between align-items-start"><span class="ico"><i class="bi bi-${k[2]}"></i></span></div><div><div class="val num">${k[1]}</div><div class="lbl">${k[0]}</div></div><div class="sub">${k[4]}</div></a>`).join('')}</div>
  <div class="grid-2 mb-3">${card('Sales vs Purchases', '<div class="chart-box"><canvas id="chSP"></canvas></div>', { sub: 'Last 14 days · net sales after returns' })}${can('profit.view') ? card('Profit & Expenses', '<div class="chart-box"><canvas id="chPE"></canvas></div>', { sub: 'Gross profit vs expenses per day' }) : card('Low stock', lowTable(low), { flush: true })}</div>
  <div class="grid-2e mb-3">${card('Recent sales', recentSales(), { flush: true, actions: '<a class="btn btn-sm btn-light" href="#/sales">View all</a>' })}${can('purchase.view') ? card('Recent purchases', recentPurchases(), { flush: true, actions: '<a class="btn btn-sm btn-light" href="#/purchases">View all</a>' }) : ''}</div>
  <div class="grid-2e">${card('Top products', top.length ? `<div class="dt-wrap"><table class="dt"><thead><tr><th>Product</th><th>Unit</th><th class="te">Sold</th><th class="te">Revenue</th>${can('profit.view') ? '<th class="te">Profit</th>' : ''}</tr></thead><tbody>${top.map(r => `<tr><td>${esc(r.name)}</td><td>${uChip(r.unit)}</td><td class="te num">${fmtQ(r.netQty, r.unit)}</td><td class="te num">${money(r.revenue)}</td>${can('profit.view') ? `<td class="te num c-success">${money(r.profit)}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : empty('bar-chart', 'No sales yet'), { flush: true, sub: 'Last 30 days' })}${card('Low stock', lowTable(low), { flush: true, actions: '<a class="btn btn-sm btn-light" href="#/inventory?f=low">View all</a>' })}</div>`);
  chart('chSP', { type: 'line', data: { labels: lab, datasets: [{ label: 'Sales', data: sal, borderColor: PREFS.primary, backgroundColor: PREFS.primary + '22', fill: true, tension: .35, pointRadius: 2 }, { label: 'Purchases', data: pur, borderColor: '#7c3aed', tension: .35, pointRadius: 2 }] } });
  chart('chPE', { type: 'bar', data: { labels: lab, datasets: [{ label: 'Gross profit', data: prof, backgroundColor: '#16a34a', borderRadius: 4, maxBarThickness: 18 }, { label: 'Expenses', data: exp, backgroundColor: '#ef4444', borderRadius: 4, maxBarThickness: 18 }] } });
} };
function lowTable(low) { return low.length ? `<div class="dt-wrap"><table class="dt"><thead><tr><th>Product</th><th>Unit</th><th class="te">Stock</th><th class="te">Min</th></tr></thead><tbody>${low.slice(0, 8).map(x => `<tr class="${x.out ? 'row-bad' : 'row-warn'}"><td><a href="#/product/${x.p.id}" class="text-reset fw-6">${esc(x.p.name)}</a></td><td>${uChip(x.u)}</td><td class="te num fw-7 ${x.out ? 'c-danger' : 'c-warning'}">${fmtQ(x.q, x.u)}</td><td class="te num">${fmtQ(x.min, x.u)}</td></tr>`).join('')}</tbody></table></div>` : empty('check2-circle', 'Stock levels are fine', 'No product is at or below its minimum.'); }
function recentSales() { const L = DB.sales.slice(-7).reverse(); return L.length ? `<div class="dt-wrap"><table class="dt"><tbody>${L.map(s => `<tr style="cursor:pointer" onclick="location.hash='#/sale/${s.id}'"><td><b class="mono small">${s.no}</b><div class="small-xs text-muted">${fmtDTt(s.date)}</div></td><td class="small">${esc(custBy(s.customerId)?.name || 'Walk-in')}</td><td>${sBadge(saleStatus(s))}</td><td class="te num fw-7">${money(saleEffC(s))}</td></tr>`).join('')}</tbody></table></div>` : empty('receipt', 'No sales found', '', '<a class="btn btn-primary btn-sm" href="#/pos">Open POS</a>'); }
function recentPurchases() { const L = DB.purchases.slice(-7).reverse(); return L.length ? `<div class="dt-wrap"><table class="dt"><tbody>${L.map(p => `<tr style="cursor:pointer" onclick="location.hash='#/purchase/${p.id}'"><td><b class="mono small">${p.no}</b><div class="small-xs text-muted">${fmtDate(p.date)}</div></td><td class="small">${esc(supBy(p.supplierId)?.name)}</td><td>${sBadge(p.status === 'Cancelled' ? 'Cancelled' : payStatus(purDueC(p), purEffC(p)))}</td><td class="te num fw-7">${money(p.totalC)}</td></tr>`).join('')}</tbody></table></div>` : empty('truck', 'No purchases yet'); }
/* per product + unit profit (sold, returned, final) — based on stored line data */
function productProfit(from, to) {
  const M = {};
  const k = (pid, u, name) => (M[pid + u] = M[pid + u] || { pid, unit: u, name, soldQty: 0, grossRev: 0, grossCost: 0, retQty: 0, retRev: 0, retCost: 0 });
  DB.sales.filter(s => s.status !== 'Cancelled' && s.date >= from && s.date < to).forEach(s => s.lines.forEach(l => { const r = k(l.pid, l.unit, l.name); r.soldQty = q3(r.soldQty + l.qty); r.grossRev += l.netC - l.taxC; r.grossCost += l.costC; }));
  DB.saleReturns.filter(x => x.date >= from && x.date < to).forEach(x => x.lines.forEach(l => { const r = k(l.pid, l.unit, l.name); r.retQty = q3(r.retQty + l.qty); r.retRev += l.revenueC; r.retCost += l.costC; }));
  return Object.values(M).map(r => ({ ...r, netQty: q3(r.soldQty - r.retQty), revenue: r.grossRev - r.retRev, cost: r.grossCost - r.retCost, profit: r.grossRev - r.retRev - r.grossCost + r.retCost }));
}
</script>
<script>
/* =====================================================================
   POS / CASHIER
   ===================================================================== */
const CART_KEY = 'amed.cart';
const blankCart = () => ({ ref: '', saleType: S().pos.defaultSaleType || 'Cash Sale', city: '', customerId: S().pos.defaultCustomer || null, lines: [], invDisc: { type: 'amt', value: 0 }, notes: '', heldId: null });
let CART = store.get(CART_KEY, null) || null;
let POS = { sel: 0, cat: 'All', q: '' };
const saveCart = () => store.set(CART_KEY, CART);

ROUTES.pos = { title: 'POS', perm: 'pos.view', render() {
  if (!CART) CART = blankCart();
  CART.lines = CART.lines.filter(l => prodBy(l.pid));
  const ses = openSession(); const cats = ['All', ...DB.lists.categories.filter(c => DB.products.some(p => p.category === c && p.active))];
  view(`<div class="pos" id="pos">
    <section class="pos-left">
      <div class="pos-top">
        <input class="form-control" id="posRef" placeholder="Invoice name / reference" value="${esc(CART.ref)}" list="refList" aria-label="Invoice name"><datalist id="refList">${['Cash Sale', 'Customer Sale', 'Project Sale', 'Duhok Sale', 'Erbil Sale', 'Wholesale', 'Retail'].map(x => `<option value="${x}">`).join('')}</datalist>
        <select class="form-select" id="posType" aria-label="Sale type">${opts(DB.lists.saleTypes, CART.saleType)}</select>
        <select class="form-select" id="posCity" aria-label="City">${opts(DB.lists.cities, CART.city, 'City (optional)')}</select>
        <div class="d-flex gap-2"><button class="btn btn-light flex-fill" onclick="posHeld()" title="Held sales (F4)"><i class="bi bi-pause-circle"></i><span class="d-none d-xxl-inline">Held</span>${DB.held.length ? `<span class="badge bg-warning text-dark">${DB.held.length}</span>` : ''}</button>${can('sale.return') ? `<button class="btn btn-light flex-fill" onclick="returnDialog()" title="Return sale (F7)"><i class="bi bi-arrow-return-left"></i><span class="d-none d-xxl-inline">Return</span></button>` : ''}</div>
      </div>
      <div class="scan"><i class="bi bi-upc-scan si"></i><input id="scanIn" autocomplete="off" class="form-control" placeholder="Scan barcode or search name / code / SKU…" aria-label="Scan or search product" ${ses ? '' : 'disabled'}><kbd class="hide-sm">F2</kbd><div class="scan-drop" id="scanDrop" hidden></div></div>
      <div class="cats" id="posCats">${cats.map(c => `<button class="${POS.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="pgrid" id="pgrid"></div>
    </section>
    <section class="card pos-cart" id="posCart" aria-label="Cart"></section>
    ${ses ? '' : `<div class="pos-closed"><div class="card card-body text-center" style="max-width:380px"><div class="mx-auto mb-3 d-grid" style="width:60px;height:60px;border-radius:16px;place-items:center;font-size:1.6rem;background:rgba(217,119,6,.12);color:var(--warning)"><i class="bi bi-lock"></i></div><h5 class="fw-7">Register is closed</h5><p class="small text-muted">Open a cashier session with the cash in the drawer before selling.</p><button class="btn btn-primary" onclick="openRegisterDlg(()=>rerender())"><i class="bi bi-unlock"></i>Open register</button></div></div>`}
  </div>
  <button class="btn btn-primary cart-fab" id="cartFab" onclick="document.body.classList.add('cart-open')"></button>`);
  posGrid(); renderCart();
  $('#posRef').oninput = e => { CART.ref = e.target.value; saveCart(); };
  $('#posType').onchange = e => { CART.saleType = e.target.value; saveCart(); };
  $('#posCity').onchange = e => { CART.city = e.target.value; saveCart(); };
  $('#posCats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; POS.cat = b.dataset.cat; $$('#posCats button').forEach(x => x.classList.toggle('on', x === b)); posGrid(); };
  $('#pgrid').onclick = e => { const t = e.target.closest('[data-pid]'); if (t) pickProduct(prodBy(t.dataset.pid)); };
  const si = $('#scanIn'); let sel = 0;
  si.oninput = () => { const q = si.value.trim().toLowerCase(); const dd = $('#scanDrop'); if (!q) { dd.hidden = true; return; } const res = searchProducts(q).slice(0, 8); sel = 0;
    dd.innerHTML = res.length ? res.map((p, i) => `<div class="gs-item ${i === 0 ? 'on' : ''}" data-pid="${p.id}">${pImg(p)}<div class="flex-fill" style="min-width:0"><b class="text-truncate">${esc(p.name)}</b><small class="d-block">${esc(p.code)} · ${esc(p.barcode)} · ${unitsOf(p).map(u => `${fmtQ(stockOf(p, u), u)} @ ${price(p.units[u].sell)}`).join(' | ')}</small></div></div>`).join('') : `<div class="p-3 small text-muted text-center">No product matches “${esc(q)}”</div>`; dd.hidden = false; };
  si.onkeydown = e => {
    const items = $$('#scanDrop .gs-item');
    if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); items.forEach((x, i) => x.classList.toggle('on', i === sel)); return; }
    if (e.key === 'ArrowUp' && items.length) { e.preventDefault(); sel = Math.max(sel - 1, 0); items.forEach((x, i) => x.classList.toggle('on', i === sel)); return; }
    if (e.key === 'Escape') { $('#scanDrop').hidden = true; si.value = ''; return; }
    if (e.key !== 'Enter') return; e.preventDefault();
    const v = si.value.trim(); if (!v) { if (CART.lines.length) openPayment(); return; }
    const exact = DB.products.find(p => p.barcode === v || p.code.toLowerCase() === v.toLowerCase() || p.sku.toLowerCase() === v.toLowerCase());
    if (exact) { beep(); si.value = ''; $('#scanDrop').hidden = true; pickProduct(exact, S().pos.scanAutoAdd); return; }
    const inv = DB.sales.find(s => s.no.toLowerCase() === v.toLowerCase()); if (inv) { si.value = ''; $('#scanDrop').hidden = true; returnDialog(inv.id); return; }
    const it = items[sel]; if (it) { si.value = ''; $('#scanDrop').hidden = true; pickProduct(prodBy(it.dataset.pid)); return; }
    toast('error', 'Product not found', `No product with barcode or code “${v}”.`); si.select();
  };
  $('#scanDrop').onmousedown = e => { const it = e.target.closest('[data-pid]'); if (it) { e.preventDefault(); si.value = ''; $('#scanDrop').hidden = true; pickProduct(prodBy(it.dataset.pid)); } };
  si.onblur = () => setTimeout(() => { const d = $('#scanDrop'); if (d) d.hidden = true; }, 150);
  if (ses && innerWidth >= 992) setTimeout(() => si.focus(), 60);
} };
const searchProducts = q => DB.products.filter(p => p.active && (p.name + ' ' + p.code + ' ' + p.barcode + ' ' + p.sku + ' ' + p.brand + ' ' + p.category).toLowerCase().includes(q));
function posGrid() {
  const g = $('#pgrid'); if (!g) return;
  const sold = {}; DB.sales.slice(-300).forEach(s => s.lines.forEach(l => sold[l.pid] = (sold[l.pid] || 0) + 1));
  const list = DB.products.filter(p => p.active && (POS.cat === 'All' || p.category === POS.cat)).sort((a, b) => (sold[b.id] || 0) - (sold[a.id] || 0));
  g.innerHTML = list.map(p => { const us = unitsOf(p); const out = us.every(u => stockOf(p, u) <= 0); const low = us.some(u => p.units[u].minStock && stockOf(p, u) <= p.units[u].minStock);
    return `<button class="ptile ${out ? 'out' : ''}" data-pid="${p.id}"><div class="d-flex justify-content-between gap-1">${pImg(p)}${out ? '<span class="badge-s" style="--c:var(--danger)">Out</span>' : low ? '<span class="badge-s" style="--c:var(--warning)">Low</span>' : ''}</div><span class="nm">${esc(p.name)}</span><span class="meta">${esc(p.code)}</span>
      <div class="units">${us.map(u => `<span class="chip">${uChip(u)} <b>${price(p.units[u].sell)}</b> · ${Number(stockOf(p, u)).toLocaleString('en-US', { maximumFractionDigits: 2 })}</span>`).join('')}</div></button>`; }).join('') || empty('box', 'No products found', 'No active products in this category.', can('product.edit') ? '<a class="btn btn-primary btn-sm" href="#/product-new">Add product</a>' : '');
}
/* choose unit / amount. Quantity-only products are added instantly. */
function pickProduct(p, instant = true) {
  if (!p) return; if (!openSession()) { toast('warning', 'Register is closed', 'Open the register first.'); return; }
  if (!p.active) { toast('error', 'Product inactive', `${p.name} is inactive and cannot be sold.`); return; }
  const us = unitsOf(p);
  if (instant && us.length === 1 && us[0] === 'pcs') { addToCart(p, us[0], 1); return; }
  let unit = us.find(u => stockOf(p, u) > 0) || us[0];
  const m = openModal({ title: esc(p.name), sub: `${esc(p.code)} · choose unit and amount`, size: '', body: `
    <div class="seg w-100 mb-3" id="quUnits">${us.map(u => `<button class="flex-fill ${u === unit ? 'on' : ''}" data-u="${u}">${UNITS[u].label}<br><small class="fw-normal">${price(p.units[u].sell)} / ${UNITS[u].short} · stock ${fmtQ(stockOf(p, u), u)}</small></button>`).join('')}</div>
    <label class="form-label" for="quQty">Amount (<span id="quLbl">${UNITS[unit].label}</span>)</label>

        const q = e.target.closest('[data-qc]'); if (q) { $('#pmCash', el).value = cStr(+q.dataset.qc); upd(); return; }
        if (e.target.closest('[data-cust]')) { e.preventDefault(); m.close(); setTimeout(pickCustomer, 300); }
      });

        const pays = PAY_METHODS.map(mm => ({ method: mm, amountC: val(mm) })).filter(x => x.amountC > 0);
        if (pays.some(x => x.amountC < 0)) { toast('error', 'Invalid amount'); return; }
        const nonCredit = pays.filter(x => x.method !== 'Credit').reduce((a, x) => a + x.amountC, 0); const credit = pays.filter(x => x.method === 'Credit').reduce((a, x) => a + x.amountC, 0);
        if (nonCredit + credit < c.total) { if (!cu) { toast('error', 'Payment is not complete', `Remaining ${money(c.total - nonCredit - credit)}. Choose a customer to sell on credit.`); return; } pays.push({ method: 'Credit', amountC: c.total - nonCredit - credit }); }
        if (credit && nonCredit + credit > c.total) { toast('error', 'Too much credit', 'Credit plus payments cannot exceed the total.'); return; }
        const cashP = pays.filter(x => x.method === 'Cash').reduce((a, x) => a + x.amountC, 0); if (nonCredit - c.total > cashP) { toast('error', 'Check the amounts', 'Only cash can be more than the total (change).'); return; }

}
function completeSale(payments, print = S().pos.autoPrint) {
  if (!guard('sale.create')) return;
  let s; try { s = postSale({ ...CART, payments }); } catch (e) { toast('error', 'Cannot complete sale', e.message); return; }
  saveDB(); CART = blankCart(); saveCart(); document.body.classList.remove('cart-open'); rerender();
  toast('success', 'Sale completed', `${s.no} · ${money(s.totalC)}${s.changeC ? ' · change ' + money(s.changeC) : ''}${saleDueC(s) > 0 ? ' · due ' + money(saleDueC(s)) : ''}`);

}

function returnDialog(saleId = null) {

    onShow(el, mm) {
      const body = $('#rtBody', el), foot = $('#rtFoot', el);

        body.innerHTML = `<div class="row g-2 mb-3"><div class="col-md-6"><input class="form-control form-control-lg" id="rtQ" placeholder="Invoice number, barcode, customer name or phone…" autofocus></div><div class="col-6 col-md-3"><input type="date" class="form-control form-control-lg" id="rtD"></div><div class="col-6 col-md-3"><button class="btn btn-light btn-lg w-100" id="rtClr">Last 14 days</button></div></div><div id="rtList" class="list-group"></div>`;
        foot.innerHTML = '<button class="btn btn-light" data-bs-dismiss="modal">Close</button>';
        const list = () => { const q = $('#rtQ', el).value.trim().toLowerCase(), d = $('#rtD', el).value; const bp = DB.products.find(p => p.barcode === q || p.code.toLowerCase() === q);
          let L = DB.sales.filter(s => s.status !== 'Cancelled' && s.lines.some(l => lineRem(l) > 0));
          if (d) { const t = startOfDay(+new Date(d)); L = L.filter(s => s.date >= t && s.date < t + DAY); } else if (!q) L = L.filter(s => s.date > now() - 14 * DAY);
          if (q) L = L.filter(s => bp ? s.lines.some(l => l.pid === bp.id) : (s.no + ' ' + s.ref + ' ' + (custBy(s.customerId)?.name || '') + ' ' + (custBy(s.customerId)?.phone || '')).toLowerCase().includes(q));
          $('#rtList', el).innerHTML = L.slice(-40).reverse().map(s => `<button class="list-group-item list-group-item-action d-flex gap-3 align-items-center" data-sid="${s.id}"><i class="bi bi-receipt fs-4 c-primary"></i><div class="flex-fill text-start"><div class="d-flex justify-content-between"><b class="mono">${s.no}</b><b class="num">${money(s.totalC)}</b></div><small class="text-muted">${fmtDTt(s.date)} · ${esc(custBy(s.customerId)?.name || 'Walk-in')} · ${s.lines.map(l => esc(l.name) + ' ' + fmtQ(l.qty, l.unit)).slice(0, 3).join(', ')}</small></div>${sBadge(saleStatus(s))}</button>`).join('') || empty('receipt', 'No invoices found', 'Search by invoice number, product barcode, customer or date.'); };
        $('#rtQ', el).oninput = debounce(list, 150); $('#rtD', el).onchange = list; $('#rtClr', el).onclick = () => { $('#rtQ', el).value = ''; $('#rtD', el).value = ''; list(); };
        $('#rtQ', el).onkeydown = e => { if (e.key === 'Enter') { const s = DB.sales.find(x => x.no.toLowerCase() === e.target.value.trim().toLowerCase()); if (s) { sel = s; lines(); } } };
        $('#rtList', el).onclick = e => { const b = e.target.closest('[data-sid]'); if (b) { sel = saleBy(b.dataset.sid); lines(); } };
        list(); setTimeout(() => $('#rtQ', el)?.focus(), 200);
      };
      const lines = () => {
        const s = sel; const cu = custBy(s.customerId);
        body.innerHTML = `<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3"><div><h5 class="fw-7 mb-0 mono">${s.no}</h5><div class="small text-muted">${fmtDTt(s.date)} · ${esc(cu?.name || 'Walk-in')} · ${esc(s.saleType)} · total ${money(s.totalC)} · paid ${money(salePaidC(s))}${saleDueC(s) > 0 ? ` · <span class="c-danger">due ${money(saleDueC(s))}</span>` : ''}</div></div>${saleId ? '' : '<button class="btn btn-light btn-sm" id="rtBack"><i class="bi bi-arrow-left"></i>Other invoice</button>'}</div>
          <div class="alert alert-info small py-2"><i class="bi bi-info-circle me-1"></i>Returns always use the <b>original invoice price and cost</b> of each line. The remaining sale keeps its original unit price.</div>
          ${s.lines.map(l => { const rem = lineRem(l); const unitRet = prop(l.netC, 1000, l.qty * 1000); return `<div class="ret-line" data-l="${l.id}"><div class="d-flex justify-content-between flex-wrap gap-2"><div><b>${esc(l.name)}</b> ${uChip(l.unit)}<div class="small text-muted">Sold ${fmtQ(l.qty, l.unit)} × ${price(l.priceP4)} = ${money(l.netC)}${l.retQty ? ` · already returned ${fmtQ(l.retQty, l.unit)}` : ''} · <b>remaining ${fmtQ(rem, l.unit)}</b></div></div>
            <div class="d-flex gap-2 align-items-center">${rem > 0 ? `<div class="input-group" style="width:190px"><input class="form-control num fw-7" data-rq="${l.id}" inputmode="decimal" placeholder="0" aria-label="Return amount"><span class="input-group-text">${UNITS[l.unit].short}</span></div><button class="btn btn-light btn-sm" data-all="${l.id}">All</button>` : '<span class="badge-s" style="--c:var(--text-3)">Fully returned</span>'}</div></div><div class="small mt-2" data-prev="${l.id}"></div></div>`; }).join('')}
          <div class="row g-2 mt-2"><div class="col-md-4"><label class="form-label">Reason</label><select class="form-select" id="rtR">${opts(['Customer return', 'Defective', 'Wrong item', 'Excess length / weight', 'Customer changed mind', 'Other'])}</select></div><div class="col-md-4"><label class="form-label">Refund method</label><select class="form-select" id="rtM">${opts([['Cash', 'Cash'], ['Card', 'Card'], ['Bank', 'Bank'], ...(cu ? [['Balance', 'Customer balance (credit note)']] : [])])}</select></div><div class="col-md-4"><label class="form-label">Note</label><input class="form-control" id="rtN"></div></div>
          <div class="calc mt-3" id="rtSum"></div>`;
        foot.innerHTML = '<button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="rtOk" disabled><i class="bi bi-arrow-return-left"></i>Confirm return</button>';

            const after = q3(rem - q); const rv = lineAt(l, rem, 'netC') - lineAt(l, after, 'netC'); const rc = lineAt(l, rem, 'costC') - lineAt(l, after, 'costC'); const rt = lineAt(l, rem, 'taxC') - lineAt(l, after, 'taxC');
            const remRev = lineAt(l, after, 'netC') - lineAt(l, after, 'taxC'), remCost = lineAt(l, after, 'costC');
            box.innerHTML = `Returning <b>${fmtQ(q, l.unit)}</b> × ${price(l.priceP4)} = <b>${money(rv)}</b>${can('profit.view') ? ` · cost reversed ${money(rc)} · profit reversed ${money(rv - rt - rc)}` : ''} → remaining <b>${fmtQ(after, l.unit)}</b> = ${money(lineAt(l, after, 'netC'))}${can('profit.view') ? ` (cost ${money(remCost)}, profit ${money(remRev - remCost)})` : ''}`;
            tot += rv; cost += rc; out.push({ lineId: l.id, qty: q }); });
          const paid = salePaidC(s), eff = saleEffC(s); const refund = Math.max(0, paid - (eff - tot)) - Math.max(0, paid - eff);
          $('#rtSum', el).innerHTML = `<div class="r"><span>Return value</span><b>${money(tot)}</b></div><div class="r"><span>Deducted from invoice due</span><span>${money(tot - refund)}</span></div><div class="r"><span>${$('#rtM', el).value === 'Balance' ? 'Credit to customer balance' : 'Refund to customer (' + $('#rtM', el).value + ')'}</span><span>${money(refund)}</span></div>`;
          $('#rtOk', el).disabled = bad || !out.length; return { out, tot, refund };
        };
        body.oninput = calc; body.onchange = calc; calc();
        body.onclick = e => { const a = e.target.closest('[data-all]'); if (a) { const l = s.lines.find(x => x.id === a.dataset.all); $(`[data-rq="${l.id}"]`, el).value = q3(lineRem(l)); calc(); } if (e.target.closest('#rtBack')) { sel = null; find(); } };
        $('#rtOk', el).onclick = async () => {
          const { out, tot, refund } = calc(); if (!out.length) return;

<script>

  el.innerHTML = `<div class="sum-row"><span>Subtotal</span><span class="num">${money(c.subtotal)}</span></div><div class="sum-row"><span>Discount</span><span class="num c-success">${BIDI('−' + money(c.disc))}</span></div><div class="sum-row"><span>Tax</span><span class="num">${money(c.tax)}</span></div><div class="sum-row total"><span>Grand total</span><span class="num">${money(c.total)}</span></div>
    <div class="mt-3"><label class="form-label">Paid now</label><div class="input-group"><span class="input-group-text">${CUR().symbol}</span><input class="form-control" id="puPaid" value="${esc(PDOC.paid)}" inputmode="decimal" placeholder="0.00"><button class="btn btn-light" id="puFull">Full</button></div><div class="invalid-feedback d-block" id="puPaidErr"></div></div>
    <div class="mt-2"><label class="form-label">Payment method</label><div class="seg w-100" id="puPM">${['Cash', 'Bank', 'Card'].map(m => `<button class="flex-fill ${PDOC.payMethod === m ? 'on' : ''}" data-pm="${m}">${m}</button>`).join('')}</div></div>
    <div class="sum-row mt-3"><span>Remaining (supplier balance)</span><b class="num ${rem > 0 ? 'c-danger' : 'c-success'}">${money(Math.max(0, rem))}</b></div><div class="mb-3">${sBadge(c.total && rem <= 0 ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid')}</div>
    <button class="btn btn-primary w-100 btn-lg" id="puSave" ${c.lines.length ? '' : 'disabled'}><i class="bi bi-check2-circle"></i>Save purchase</button>`;
  const pi = $('#puPaid'); pi.oninput = () => { PDOC.paid = pi.value; const cc = calcPurchase(puDoc()); const r = cc.total - toC(pi.value); el.querySelector('.sum-row.mt-3 b').textContent = money(Math.max(0, r)); };
  pi.onchange = () => puTotals();
  $('#puFull').onclick = () => { PDOC.paid = cStr(c.total); puTotals(); };
  $('#puPM').onclick = e => { const b = e.target.closest('[data-pm]'); if (b) { PDOC.payMethod = b.dataset.pm; $$('#puPM button').forEach(x => x.classList.toggle('on', x === b)); } };
  $('#puSave').onclick = async () => {
    const d = puDoc(); d.paidC = toC(PDOC.paid || 0); $('#puSupErr').textContent = ''; $('#puPaidErr').textContent = '';
    if (!d.supplierId) { $('#puSupErr').textContent = 'Select a supplier.'; $('#puSup').focus(); return; }
    const bad = d.lines.findIndex(l => !validQty(l.qty, l.unit)); if (bad >= 0) { toast('error', 'Check line ' + (bad + 1), `Enter a valid ${UNITS[d.lines[bad].unit].label.toLowerCase()} amount${d.lines[bad].unit === 'pcs' ? ' (whole pieces)' : ''}.`); $(`[data-pq="${bad}"]`)?.classList.add('is-invalid'); return; }
    const badP = d.lines.findIndex(l => !(l.priceP4 > 0)); if (badP >= 0) { toast('error', 'Check line ' + (badP + 1), 'Enter a valid purchase price.'); $(`[data-pp="${badP}"]`)?.classList.add('is-invalid'); return; }
    const tot = calcPurchase(d).total; if (d.paidC < 0 || d.paidC > tot) { $('#puPaidErr').textContent = 'Paid must be between 0 and the grand total.'; return; }
    if (!(await confirmDlg({ title: `Post purchase of ${money(tot)}?`, text: `${d.lines.length} line(s) will be added to stock.`, ok: 'Save purchase', danger: false, icon: 'truck' }))) return;
    try { const p = postPurchase(d); saveDB(); PDOC = null; toast('success', 'Purchase saved', `${p.no} · stock updated`); location.hash = '#/purchase/' + p.id; } catch (e) { toast('error', 'Cannot save purchase', e.message); }
  };
}
ROUTES.purchase = { title: 'Purchase', perm: 'purchase.view', render(id) {
  const p = purBy(id); if (!p) return ROUTES.notfound.render(); const s = supBy(p.supplierId); const due = purDueC(p);
  const rets = p.returns.map(r => byId('purchaseReturns', r));
  view(pageHead(`Purchase ${p.no}`, `${esc(s.name)} · supplier invoice ${esc(p.invoiceNo || '—')} · ${fmtDTt(p.date)}`, `<button class="btn btn-light" onclick="previewDoc('Purchase ${p.no}',purchaseDoc('${p.id}'),'A4')"><i class="bi bi-printer"></i>Print</button>${p.status !== 'Cancelled' && can('purchase.return') ? `<button class="btn btn-light" onclick="purchaseReturnDlg('${p.id}')"><i class="bi bi-box-arrow-left"></i>Return to supplier</button>` : ''}${due > 0 && can('supplier.manage') ? `<button class="btn btn-primary" onclick="paySupplierDlg('${s.id}')"><i class="bi bi-cash-coin"></i>Pay supplier</button>` : ''}${p.status !== 'Cancelled' && can('purchase.delete') ? `<button class="btn btn-outline-danger" onclick="cancelPurchaseDlg('${p.id}')"><i class="bi bi-x-circle"></i>Cancel</button>` : ''}`, '<a href="#/purchases">Purchases</a> / ' + p.no) + `
  <div class="grid-2"><div class="stack">${card('Items', `<div class="dt-wrap"><table class="dt cards"><thead><tr><th>Product</th><th>Unit</th><th class="te">Qty</th><th class="te">Price</th><th class="te">Discount</th><th class="te">Tax</th><th class="te">Total</th><th class="te">Unit cost</th><th class="te">Returned</th></tr></thead><tbody>${p.lines.map(l => `<tr><td class="primary"><a class="fw-6 text-reset" href="#/product/${l.pid}">${esc(l.name)}</a></td><td data-label="Unit">${uChip(l.unit)}</td><td data-label="Qty" class="te num">${fmtQ(l.qty, l.unit)}</td><td data-label="Price" class="te num">${price(l.priceP4)}</td><td data-label="Discount" class="te num">${l.discC ? money(l.discC) : '—'}</td><td data-label="Tax" class="te num">${l.taxC ? money(l.taxC) : '—'}</td><td data-label="Total" class="te num fw-7">${money(l.totalC)}</td><td data-label="Unit cost" class="te num">${price(l.costP4)}</td><td data-label="Returned" class="te num">${l.retQty ? fmtQ(l.retQty, l.unit) : '—'}</td></tr>`).join('')}</tbody></table></div>`, { flush: true })}
    ${rets.length ? card('Purchase returns', `<div class="dt-wrap"><table class="dt"><tbody>${rets.map(r => `<tr><td class="mono fw-6">${r.no}</td><td>${fmtDT(r.date)}</td><td class="small">${r.lines.map(l => esc(l.name) + ' ' + fmtQ(l.qty, l.unit)).join('<br>')}</td><td class="te num">${money(r.totalC)}</td><td>${r.refundC ? sBadge(r.refundMethod) + ' ' + money(r.refundC) : '<span class="small text-muted">Balance reduced</span>'}</td></tr>`).join('')}</tbody></table></div>`, { flush: true }) : ''}
    ${card('Payments', p.payments.length ? `<div class="dt-wrap"><table class="dt"><tbody>${p.payments.map(x => `<tr><td>${fmtDT(x.date)}</td><td>${sBadge(x.method)}</td><td class="small">${x.kind === 'refund' ? 'Refund received' : x.kind === 'payment' ? 'Payment ' + esc(x.ref || '') : 'At purchase'}</td><td class="te num fw-7">${BIDI((x.kind === 'refund' ? '−' : '') + money(x.amountC))}</td></tr>`).join('')}</tbody></table></div>` : empty('hourglass', 'Not paid yet'), { flush: true })}</div>
  <div class="stack">${card('Summary', `<div class="mb-3">${sBadge(p.status === 'Cancelled' ? 'Cancelled' : payStatus(due, purEffC(p)))}</div><div class="sum-row"><span>Subtotal</span><span class="num">${money(p.subtotalC)}</span></div><div class="sum-row"><span>Discount</span><span class="num">${BIDI('−' + money(p.discC))}</span></div><div class="sum-row"><span>Tax</span><span class="num">${money(p.taxC)}</span></div><div class="sum-row total"><span>Grand total</span><span class="num">${money(p.totalC)}</span></div>${purRetC(p) ? `<div class="sum-row"><span>Returned</span><span class="num c-danger">${BIDI('−' + money(purRetC(p)))}</span></div>` : ''}<div class="sum-row"><span>Paid</span><span class="num">${money(purPaidC(p))}</span></div><div class="sum-row fw-7"><span>Remaining</span><span class="num ${due > 0 ? 'c-danger' : 'c-success'}">${money(Math.max(0, due))}</span></div>${p.notes ? `<p class="small mt-2 mb-0">${esc(p.notes)}</p>` : ''}${p.status === 'Cancelled' ? `<div class="alert alert-danger small mt-2 mb-0">Cancelled · ${esc(p.cancelReason)}</div>` : ''}`)}
    ${card('Supplier', `<div class="info-grid"><div><small>Name</small><span><a href="#/supplier/${s.id}">${esc(s.name)}</a></span></div><div><small>Phone</small><span>${esc(s.phone)}</span></div><div><small>Balance</small><span class="${supBalanceC(s) > 0 ? 'c-danger' : ''}">${money(supBalanceC(s))}</span></div><div><small>Received by</small><span>${esc(userBy(p.user).name)}</span></div></div>`)}</div></div>`);
} };
function cancelPurchaseDlg(id) {
  const p = purBy(id); openModal({ title: 'Cancel purchase ' + p.no, icon: 'x-circle', size: 'sm', body: `<p class="small text-muted">Stock added by this purchase is removed. Only possible when nothing from it has been sold.</p>${fld('Reason', '<input class="form-control" id="cpR" autofocus>', { req: true })}`, footer: '<button class="btn btn-light" data-bs-dismiss="modal">Close</button><button class="btn btn-danger" data-ok>Cancel purchase</button>',
    onShow(el, m) { el.querySelector('[data-ok]').onclick = () => { const r = $('#cpR', el).value.trim(); if (r.length < 3) return setErr($('#cpR', el), 'Enter a reason.'); try { cancelPurchase(p, r); saveDB(); m.close(); toast('success', 'Purchase cancelled'); rerender(); } catch (e) { toast('error', 'Cannot cancel', e.message); } }; } });
}

ROUTES['purchase-returns'] = { title: 'Purchase Returns', perm: 'purchase.return', render() {
  view(pageHead('Purchase Returns', 'Return part or all of a purchase line to the supplier. Stock and supplier balance are updated automatically.', '<button class="btn btn-primary" onclick="purchaseReturnDlg()"><i class="bi bi-plus-lg"></i>New purchase return</button>') + '<div class="card" id="tPR"></div>');
  table($('#tPR'), 'pret', { rows: () => DB.purchaseReturns.slice().reverse(), reset: true, search: r => r.no + ' ' + r.purchaseNo + ' ' + supBy(r.supplierId)?.name,
    cols: [{ k: 'no', label: 'Return', sort: true, render: r => `<b class="mono">${r.no}</b>` }, { k: 'date', label: 'Date', sort: true, render: r => fmtDT(r.date) }, { k: 'p', label: 'Purchase', render: r => `<a class="mono" href="#/purchase/${r.purchaseId}">${r.purchaseNo}</a>` }, { k: 's', label: 'Supplier', render: r => esc(supBy(r.supplierId)?.name) },
      { k: 'i', label: 'Items', render: r => `<span class="small">${r.lines.map(l => esc(l.name) + ': ' + fmtQ(l.qty, l.unit)).join('<br>')}</span>` }, { k: 'totalC', label: 'Value', te: true, sort: true, render: r => `<b class="num">${money(r.totalC)}</b>` }, { k: 'set', label: 'Settlement', render: r => r.refundC ? `${sBadge(r.refundMethod)} ${money(r.refundC)}` : '<span class="small text-muted">Supplier balance reduced</span>' }],
    empty: { icon: 'box-arrow-left', title: 'No purchase returns', action: '<button class="btn btn-primary btn-sm" onclick="purchaseReturnDlg()">New purchase return</button>' } });
} };
function purchaseReturnDlg(pid = null) {
  if (!guard('purchase.return')) return; let sel = pid ? purBy(pid) : null;
  openModal({ title: 'Purchase return', icon: 'box-arrow-left', size: 'xl', body: '<div id="prB"></div>', footer: '<div id="prF" class="d-flex gap-2 w-100 justify-content-end"></div>', onShow(el, mm) {
    const B = $('#prB', el), F = $('#prF', el);
    const find = () => { B.innerHTML = `<input class="form-control form-control-lg mb-3" id="prQ" placeholder="Search purchase number, supplier invoice or supplier…" autofocus><div class="list-group" id="prL"></div>`; F.innerHTML = '<button class="btn btn-light" data-bs-dismiss="modal">Close</button>';
      const list = () => { const q = $('#prQ', el).value.toLowerCase(); $('#prL', el).innerHTML = DB.purchases.filter(p => p.status !== 'Cancelled' && p.lines.some(l => l.qty - l.retQty > 0) && (p.no + p.invoiceNo + supBy(p.supplierId).name).toLowerCase().includes(q)).slice(-30).reverse().map(p => `<button class="list-group-item list-group-item-action" data-pid="${p.id}"><div class="d-flex justify-content-between"><b class="mono">${p.no} · ${esc(p.invoiceNo)}</b><b class="num">${money(p.totalC)}</b></div><small class="text-muted">${fmtDate(p.date)} · ${esc(supBy(p.supplierId).name)} · ${p.lines.length} lines</small></button>`).join('') || empty('truck', 'No purchases found'); };
      $('#prQ', el).oninput = list; $('#prL', el).onclick = e => { const b = e.target.closest('[data-pid]'); if (b) { sel = purBy(b.dataset.pid); lines(); } }; list(); };
    const lines = () => { const p = sel;
      B.innerHTML = `<h5 class="fw-7 mono">${p.no} <small class="text-muted fw-normal">${esc(supBy(p.supplierId).name)} · ${fmtDate(p.date)} · paid ${money(purPaidC(p))} of ${money(purEffC(p))}</small></h5>
        ${p.lines.map(l => { const left = q3(l.qty - l.retQty); const pr = prodBy(l.pid); return `<div class="ret-line" data-l="${l.id}"><div class="d-flex justify-content-between flex-wrap gap-2"><div><b>${esc(l.name)}</b> ${uChip(l.unit)}<div class="small text-muted">Purchased ${fmtQ(l.qty, l.unit)} × ${price(l.priceP4)} · returned ${fmtQ(l.retQty, l.unit)} · <b>can return ${fmtQ(left, l.unit)}</b> · in stock ${fmtQ(stockOf(pr, l.unit), l.unit)}</div></div>${left > 0 ? `<div class="input-group" style="width:190px"><input class="form-control num fw-7" data-rq="${l.id}" inputmode="decimal" placeholder="0"><span class="input-group-text">${UNITS[l.unit].short}</span></div>` : '<span class="badge-s" style="--c:var(--text-3)">Fully returned</span>'}</div><div class="small mt-1" data-pv="${l.id}"></div></div>`; }).join('')}
        <div class="row g-2 mt-1"><div class="col-md-4"><label class="form-label">Reason</label><select class="form-select" id="prR">${opts(['Defective', 'Wrong item', 'Excess quantity', 'Damaged in delivery', 'Other'])}</select></div><div class="col-md-4"><label class="form-label">Settlement</label><select class="form-select" id="prS">${opts([['Balance', 'Reduce supplier balance'], ['Cash', 'Cash refund'], ['Bank', 'Bank refund']])}</select></div><div class="col-md-4"><label class="form-label">Note</label><input class="form-control" id="prN"></div></div><div class="calc mt-3" id="prSum"></div>`;
      F.innerHTML = `${pid ? '' : '<button class="btn btn-light me-auto" id="prBack">Back</button>'}<button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="prOk" disabled>Confirm return</button>`;
      const calc = () => { let tot = 0, bad = false; const out = [];
        p.lines.forEach(l => { const i = $(`[data-rq="${l.id}"]`, el); if (!i) return; const q = q3(parseFloat(i.value) || 0); const left = q3(l.qty - l.retQty); const pv = $(`[data-pv="${l.id}"]`, el); i.classList.remove('is-invalid'); $(`[data-l="${l.id}"]`, el).classList.toggle('on', q > 0); if (!i.value) { pv.innerHTML = ''; return; }
          const pr = prodBy(l.pid); const err = !validQty(q, l.unit) ? (l.unit === 'pcs' ? 'Whole pieces only.' : 'Enter a positive amount.') : q > left ? `Purchase return exceeds purchase – maximum ${fmtQ(left, l.unit)}.` : q > stockOf(pr, l.unit) && !S().inventory.allowNegative ? `Only ${fmtQ(stockOf(pr, l.unit), l.unit)} in stock.` : '';
          if (err) { bad = true; i.classList.add('is-invalid'); pv.innerHTML = `<span class="c-danger">${err}</span>`; return; }
          const v = prop(l.totalC, left, l.qty) - prop(l.totalC, q3(left - q), l.qty); tot += v; out.push({ lineId: l.id, qty: q }); pv.innerHTML = `Return value <b>${money(v)}</b> (cost ${price(l.costP4)}/${UNITS[l.unit].short})`; });
        const paid = purPaidC(p), eff = purEffC(p); const ref = Math.max(0, paid - (eff - tot)) - Math.max(0, paid - eff);
        $('#prSum', el).innerHTML = `<div class="r"><span>Return value</span><b>${money(tot)}</b></div><div class="r"><span>Reduces what you owe</span><span>${money(tot - ref)}</span></div><div class="r"><span>Overpaid – ${$('#prS', el).value === 'Balance' ? 'kept as supplier credit' : 'refund from supplier'}</span><span>${money(ref)}</span></div>`;
        $('#prOk', el).disabled = bad || !out.length; return { out, tot }; };
      B.oninput = calc; B.onchange = calc; calc();
      $('#prBack', el) && ($('#prBack', el).onclick = () => { sel = null; find(); });
      $('#prOk', el).onclick = async () => { const { out, tot } = calc(); if (!(await confirmDlg({ title: `Return ${money(tot)} to supplier?`, text: 'Stock will be reduced now.', ok: 'Confirm return' }))) return; try { const r = postPurchaseReturn({ purchaseId: p.id, lines: out, settlement: $('#prS', el).value, reason: $('#prR', el).value, note: $('#prN', el).value }); saveDB(); mm.close(); toast('success', 'Purchase return saved', `${r.no} · ${money(r.totalC)}`); rerender(); } catch (e) { toast('error', 'Cannot return', e.message); } };
    };
    sel ? lines() : find();
  } });
}
</script>
<script>
/* =====================================================================
   PRODUCTS
   ===================================================================== */
const fEl = (f, n) => f.querySelector(`[name="${n}"]`);
const kpis = K => `<div class="kpi-grid mb-3">${K.map(k => `<div class="card kpi" style="--c:${k[3]};cursor:default"><span class="ico"><i class="bi bi-${k[2]}"></i></span><div><div class="val num">${k[1]}</div><div class="lbl">${k[0]}</div></div>${k[4] ? `<div class="sub">${k[4]}</div>` : ''}</div>`).join('')}</div>`;
const stockState = (p, u) => { const q = stockOf(p, u), min = p.units[u]?.minStock || 0; return q <= 0 ? 'Out of stock' : min && q <= min ? 'Low stock' : 'In stock'; };
const qtyInput = (name, val, u, extra = '') => `<input class="form-control" name="${name}" inputmode="decimal" value="${esc(val ?? '')}" ${extra} placeholder="0${u === 'pcs' ? '' : '.00'}">`;
const numVal = v => { const s = String(v ?? '').trim(); if (s === '') return 0; const n = Number(s.replace(/,/g, '')); return isFinite(n) ? n : NaN; };

ROUTES.products = { title: 'Products', perm: 'product.view', render() {
  const rows = () => { const u = TBL.products?.st.f.unit; return DB.products.filter(p => !u || p.units[u]?.on).sort((a, b) => a.name.localeCompare(b.name)); };
  const all = DB.products; const val = all.reduce((a, p) => a + unitsOf(p).reduce((b, u) => b + stockValueC(p, u), 0), 0);
  view(pageHead('Products', 'Each product can be sold by Quantity, Meter and/or KG – every unit has its own prices and its own stock.', `${can('stock.adjust') ? '<button class="btn btn-light" onclick="adjustDlg()"><i class="bi bi-plus-slash-minus"></i>Adjust stock</button>' : ''}${can('product.edit') ? '<a class="btn btn-primary" href="#/product-new"><i class="bi bi-plus-lg"></i>New product</a>' : ''}`) +
    kpis([['Products', all.length, 'boxes', 'var(--primary)', `${all.filter(p => p.active).length} active`], ['Low / out of stock', lowStockList().length, 'exclamation-triangle', 'var(--warning)'], ['Multi-unit products', all.filter(p => unitsOf(p).length > 1).length, 'rulers', 'var(--violet)'], ...(can('profit.view') ? [['Stock value (cost)', money(val), 'box-seam', '#0891b2']] : [])]) + `<div class="card"><div id="tProd"></div></div>`);
  table($('#tProd'), 'products', { rows, ph: 'Name, code, barcode, SKU, brand…', search: p => [p.name, p.code, p.barcode, p.sku, p.brand, p.category, p.type].join(' '),
    filters: [{ k: 'cat', label: 'Category', options: DB.lists.categories, get: p => p.category }, { k: 'type', label: 'Type', options: DB.lists.types, get: p => p.type }, { k: 'unit', label: 'Unit', options: [['pcs', 'Quantity'], ['m', 'Meter'], ['kg', 'KG']], get: p => TBL.products.st.f.unit }, { k: 'st', label: 'Status', options: ['Active', 'Inactive'], get: p => p.active ? 'Active' : 'Inactive' }],
    cols: [{ k: 'name', label: 'Product', sort: true, render: p => prodCell(p, `<span class="mono">${esc(p.code)}</span> · ${esc(p.barcode)}`) }, { k: 'category', label: 'Category', sort: true, render: p => `${esc(p.category)}<div class="small-xs text-muted">${esc(p.type)} · ${esc(p.brand)}</div>` },
      { k: 'units', label: 'Units', render: unitChips }, { k: 'stock', label: 'Stock', render: p => unitsOf(p).map(u => `<div class="num small ${stockState(p, u) === 'Out of stock' ? 'c-danger fw-7' : stockState(p, u) === 'Low stock' ? 'c-warning fw-7' : ''}">${fmtQ(stockOf(p, u), u)}</div>`).join('') },
      { k: 'sell', label: 'Sell price', te: true, render: p => unitsOf(p).map(u => `<div class="num small">${price(p.units[u].sell)}<span class="text-muted">/${UNITS[u].short}</span></div>`).join('') },
      ...(can('profit.view') ? [{ k: 'cost', label: 'Cost', te: true, render: p => unitsOf(p).map(u => `<div class="num small text-muted">${price(unitCostP4(p, u))}</div>`).join('') }] : []),
      { k: 'active', label: 'Status', render: p => sBadge(p.active ? 'Active' : 'Inactive') }],
    actions: p => `<button class="btn btn-sm btn-light btn-icon" data-act="view" data-id="${p.id}" title="History"><i class="bi bi-clock-history"></i></button>${can('product.edit') ? `<button class="btn btn-sm btn-light btn-icon" data-act="edit" data-id="${p.id}" title="Edit"><i class="bi bi-pencil"></i></button>` : ''}${can('stock.adjust') ? `<button class="btn btn-sm btn-light btn-icon" data-act="adj" data-id="${p.id}" title="Adjust stock"><i class="bi bi-plus-slash-minus"></i></button>` : ''}`,
    onAct: (a, id) => a === 'view' ? location.hash = '#/product/' + id : a === 'edit' ? location.hash = '#/product-new?id=' + id : adjustDlg(id), onRow: id => location.hash = '#/product/' + id,
    empty: { icon: 'boxes', title: 'No products yet', text: 'Add your first product with its units and prices.', action: can('product.edit') ? '<a class="btn btn-primary btn-sm" href="#/product-new">New product</a>' : '' } });
} };

/* ---------------- product form (create / edit) ---------------- */
let PIMG = null;
ROUTES['product-new'] = { title: 'Product', perm: 'product.edit', render(_, q) {
  const p = q.id ? prodBy(q.id) : null; if (q.id && !p) return ROUTES.notfound.render();
  PIMG = p?.image || '';
  const U = p ? p.units : { pcs: { on: true }, m: { on: false }, kg: { on: false } };

function saveProduct(p) {

  if (name.length < 2) err('pname', 'Enter the product name (at least 2 characters).');
  if (!code) err('code', 'Enter a product code.'); else if (DB.products.some(x => x !== p && x.code.toLowerCase() === code.toLowerCase())) err('code', 'This code is already used by another product.');
  if (bc) { const d = DB.products.find(x => x !== p && (x.barcode === bc || x.code === bc)); if (d) err('barcode', `Duplicate barcode – already used by “${d.name}”.`); if (!/^[\w\-]+$/.test(bc)) err('barcode', 'Use letters and digits only.'); }

  const units = {};

    const x = { on: !!v['on_' + u], buy: P4('buy'), sell: P4('sell'), min: P4('min'), wholesale: P4('wholesale'), retail: P4('retail'), minStock: numVal(v['minStock_' + u]), maxStock: numVal(v['maxStock_' + u]), opening: old.opening || 0 };

      ['buy', 'sell', 'min', 'wholesale', 'retail'].forEach(k => bad(k) && err(k + '_' + u, 'Enter a valid positive number.'));
      if (!(x.sell > 0)) err('sell_' + u, `Enter the ${UNITS[u].label} selling price.`);
      if (x.min && x.sell && x.min > x.sell) err('min_' + u, 'Minimum price cannot be higher than the selling price.');

    ${fld('Amount', '<div class="input-group"><input class="form-control" name="qty" inputmode="decimal"><span class="input-group-text" id="adjU">pcs</span></div>', { req: true, col: 'col-6' })}

    onShow(el, m) {
      const f = $('#adjF', el); const P = () => prodBy(fEl(f, 'pid').value);
      const fillUnits = () => { const p = P(); fEl(f, 'unit').innerHTML = p ? opts(unitsOf(p).map(u => [u, UNITS[u].label]), unit && p.units[unit]?.on ? unit : unitsOf(p)[0]) : ''; prev(); };
      const prev = () => { const p = P(), u = fEl(f, 'unit').value; $('#adjU', el).textContent = UNITS[u]?.short || '—'; if (!p || !u) { $('#adjPrev', el).innerHTML = '<div class="r"><span>Select a product</span><span></span></div>'; return; } const q = numVal(fEl(f, 'qty').value) || 0; const nx = q3(stockOf(p, u) + dir * q);

      fEl(f, 'pid').onchange = () => { unit = null; fillUnits(); }; fEl(f, 'unit').onchange = prev; fEl(f, 'qty').oninput = prev;
      $('#adjDir', el).onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; dir = +b.dataset.d; $$('#adjDir button', el).forEach(x => x.classList.toggle('on', x === b)); prev(); };

async function deleteParty(kind, id) {
  const isC = kind === 'customer'; const x = isC ? custBy(id) : supBy(id);

  if (used) return toast('error', 'Cannot delete', `${x.name} has ${isC ? 'invoices or payments' : 'purchases or payments'}. The account history must be kept.`);
  if ((isC ? custBalanceC(x) : supBalanceC(x)) !== 0) return toast('error', 'Cannot delete', 'The account has an opening balance.');
  if (!(await confirmDlg({ title: `Delete ${esc(x.name)}?`, text: 'This cannot be undone.', ok: 'Delete' }))) return;
  const L = isC ? DB.customers : DB.suppliers; L.splice(L.indexOf(x), 1);
  if (isC && CART?.customerId === id) { CART.customerId = null; saveCart(); }
  audit(isC ? 'Customer deleted' : 'Supplier deleted', x.code, x.name); saveDB(); toast('success', 'Deleted', x.name); rerender();
}

<script>
/* =====================================================================
